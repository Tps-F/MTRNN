[project]
name = "mtrnn"
version = "0.1.0"
description = "PyTorch port of the multiple timescale RNN of Yamashita & Tani (2008)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtrnn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
